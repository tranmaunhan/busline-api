spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.format_sql=true

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.default-role=${APP_DEFAULT_ROLE:Customer}
app.security.google.client-id=${GOOGLE_CLIENT_ID}
app.security.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.security.google.redirect-uri=${GOOGLE_REDIRECT_URI:https://aihost.io.vn}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://aihost.io.vn}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


