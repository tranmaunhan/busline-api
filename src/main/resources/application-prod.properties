spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.format_sql=true

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.default-role=${APP_DEFAULT_ROLE:Customer}
app.security.google.client-id=${GOOGLE_CLIENT_ID}
app.security.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.security.google.redirect-uri=${GOOGLE_REDIRECT_URI:https://aihost.io.vn}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://aihost.io.vn}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

app.notification.email.enabled=${APP_NOTIFICATION_EMAIL_ENABLED:true}
app.notification.email.from-address=${MAIL_FROM:${spring.mail.username:}}
app.notification.email.from-name=${APP_NOTIFICATION_EMAIL_FROM_NAME:SaigonST BusLine}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

sepay.webhook.secret=${SEPAY_WEBHOOK_SECRET:}
sepay.webhook.allowed-clock-skew-seconds=${SEPAY_WEBHOOK_ALLOWED_CLOCK_SKEW_SECONDS:300}
sepay.webhook.pending-booking-status=${SEPAY_PENDING_BOOKING_STATUS:0}
sepay.webhook.paid-booking-status=${SEPAY_PAID_BOOKING_STATUS:1}


