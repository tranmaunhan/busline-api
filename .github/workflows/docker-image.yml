name: Deploy Spring Boot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Jar
        run: mvn clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/busline-api:latest .

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/busline-api:latest

      - name: Deploy VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/busline-api:latest

            docker stop busline-api || true
            docker rm busline-api || true

            docker run -d \
              --name busline-api \
              --network busline-network \
              --restart always \
              -p 8080:8080 \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e GOOGLE_REDIRECT_URI="${{ secrets.GOOGLE_REDIRECT_URI }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e SEPAY_WEBHOOK_SECRET="${{ secrets.SEPAY_WEBHOOK_SECRET }}" \
              -e SEPAY_WEBHOOK_ALLOWED_CLOCK_SKEW_SECONDS="${{ secrets.SEPAY_WEBHOOK_ALLOWED_CLOCK_SKEW_SECONDS }}" \
              -e SEPAY_PENDING_BOOKING_STATUS="${{ secrets.SEPAY_PENDING_BOOKING_STATUS }}" \
              -e SEPAY_PAID_BOOKING_STATUS="${{ secrets.SEPAY_PAID_BOOKING_STATUS }}" \
              ${{ secrets.DOCKER_USERNAME }}/busline-api:latest
